spring.application.name=api-gateway
server.port=8090

# =====================================
# Eureka Configuration
# =====================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# =====================================
# API Gateway Routes
# =====================================

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=vehicle-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://VEHICLE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/vehicles/**

spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/bookings/**

spring.cloud.gateway.server.webmvc.routes[3].id=content-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://CONTENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/content/**

spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/payments/**

# =====================================
# Swagger UI Aggregation
# =====================================

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/user-service/api-docs

springdoc.swagger-ui.urls[1].name=Vehicle Service
springdoc.swagger-ui.urls[1].url=/vehicle-service/api-docs

springdoc.swagger-ui.urls[2].name=Booking Service
springdoc.swagger-ui.urls[2].url=/booking-service/api-docs

springdoc.swagger-ui.urls[3].name=Content Service
springdoc.swagger-ui.urls[3].url=/content-service/api-docs

springdoc.swagger-ui.urls[4].name=Payment Service
springdoc.swagger-ui.urls[4].url=/payment-service/api-docs

# =====================================
# Swagger Routes
# =====================================

spring.cloud.gateway.server.webmvc.routes[5].id=user-swagger
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/user-service/api-docs
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/api-docs

spring.cloud.gateway.server.webmvc.routes[6].id=vehicle-swagger
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://VEHICLE-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/vehicle-service/api-docs
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=SetPath=/api-docs

spring.cloud.gateway.server.webmvc.routes[7].id=booking-swagger
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/booking-service/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=SetPath=/api-docs

spring.cloud.gateway.server.webmvc.routes[8].id=content-swagger
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://CONTENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/content-service/api-docs
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=SetPath=/api-docs

spring.cloud.gateway.server.webmvc.routes[9].id=payment-swagger
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/payment-service/api-docs
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=SetPath=/api-docs

# =====================================
# JWT
# =====================================

jwt.secret=MyVehicleRentalSystemSecretKeyForJwtAuthentication123456789