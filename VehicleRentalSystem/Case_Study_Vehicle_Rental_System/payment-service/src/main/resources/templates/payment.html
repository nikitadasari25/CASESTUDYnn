<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
         content="width=device-width, initial-scale=1.0">
<title>Vehicle Rental Payment</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
       body {
           font-family: Arial, sans-serif;
           background: #f5f5f5;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
       }
       .payment-box {
           background: white;
           padding: 30px;
           width: 350px;
           border-radius: 10px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.1);
       }
       h2 {
           text-align: center;
       }
       input {
           width: 100%;
           padding: 10px;
           margin-top: 8px;
           margin-bottom: 15px;
           box-sizing: border-box;
       }
       button {
           width: 100%;
           padding: 12px;
           background: #3399cc;
           color: white;
           border: none;
           cursor: pointer;
           border-radius: 5px;
       }
       button:hover {
           background: #267da3;
       }
       #message {
           margin-top: 15px;
           text-align: center;
       }
</style>
</head>
<body>
<div class="payment-box">
<h2>Vehicle Rental Payment</h2>
<label>Booking ID</label>
<input type="number"
          id="bookingId"
          value="101">
<label>Amount (₹)</label>
<input type="number"
          id="amount"
          value="500"
          min="1">
<button onclick="startPayment()">
       Pay Now
</button>
<div id="message"></div>
</div>

<script>
async function startPayment() {
   const bookingId =
       document.getElementById("bookingId").value;
   const amount =
       document.getElementById("amount").value;
   const message =
       document.getElementById("message");
   if (!bookingId || !amount) {
       message.innerHTML =
           "Please enter booking ID and amount.";
       return;
   }
   try {
       // Step 1: Create Razorpay order
       const response = await fetch(
           "/api/payments/create-order",
           {
               method: "POST",
               headers: {
                   "Content-Type": "application/json"
               },
               body: JSON.stringify({
                   bookingId: Number(bookingId),
                   amount: Number(amount)
               })
           }
       );
       if (!response.ok) {
           throw new Error(
               "Unable to create payment order"
           );
       }
       const data = await response.json();
       // Step 2: Razorpay Checkout
       const options = {
           key: data.keyId,
           amount: data.amount * 100,
           currency: data.currency,
           name: "Vehicle Rental System",
           description: "Vehicle Rental Booking",
           order_id: data.orderId,
           handler: async function (response) {
               console.log(response);
               // Step 3: Verify payment
               const verifyResponse =
                   await fetch(
                       "/api/payments/verify",
                       {
                           method: "POST",
                           headers: {
                               "Content-Type":
                                   "application/json"
                           },
                           body: JSON.stringify({
                               razorpayOrderId:
                                   response.razorpay_order_id,
                               razorpayPaymentId:
                                   response.razorpay_payment_id,
                               razorpaySignature:
                                   response.razorpay_signature
                           })
                       }
                   );
               const result =
                   await verifyResponse.text();
               message.innerHTML = result;
           },
           prefill: {
               name: "Test User",
               email: "test@example.com",
               contact: "9999999999"
           },
           theme: {
               color: "#3399cc"
           }
       };
       const razorpay =
           new Razorpay(options);
       razorpay.open();
   } catch (error) {
       console.error(error);
       message.innerHTML =
           "Something went wrong: "
           + error.message;
   }
}
</script>
</body>
</html>
