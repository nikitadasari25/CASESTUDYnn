# Application
spring.application.name=vehicle-service
# Server
server.port=8082
# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=niki@25
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Logging
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.file.name=logs/vehicle-service.log

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html